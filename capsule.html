<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Future Capsule | FutureMe</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .capsule-page {
            min-height: 100vh;
            padding: 40px 20px 60px;
        }

        .capsule-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .capsule-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .capsule-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #10145c;
        }

        .capsule-header p {
            color: #666;
            font-size: 17px;
        }

        .capsule-form-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(37, 99, 235, 0.10);
            margin-bottom: 35px;
        }

        .capsule-form-card h2 {
            color: #10145c;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d9def0;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #5b45d8;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
        }

        .save-capsule-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-capsule-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .capsule-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .capsule-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.09);
            border: 1px solid #edf0fb;
        }

        .capsule-card.locked {
            background: linear-gradient(135deg, #f4f1ff, #eef4ff);
        }

        .capsule-card.unlocked {
            background: linear-gradient(135deg, #f0fdf4, #eff6ff);
        }

        .capsule-status {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .locked .capsule-status {
            background: #e9ddff;
            color: #673ab7;
        }

        .unlocked .capsule-status {
            background: #dcfce7;
            color: #15803d;
        }

        .capsule-card h3 {
            color: #10145c;
            margin: 8px 0 10px;
        }

        .capsule-message {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 15px;
        }

        .unlock-date {
            color: #666;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .delete-capsule-btn {
            border: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .delete-capsule-btn:hover {
            background: #fecaca;
        }

        .locked-message {
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }

        .empty-capsules {
            text-align: center;
            padding: 35px;
            background: #ffffff;
            border-radius: 18px;
            color: #777;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.08);
        }

        .loading-message,
        .error-message {
            text-align: center;
            padding: 25px;
            color: #666;
        }

        .error-message {
            color: #b91c1c;
        }

        @media (max-width: 600px) {

            .capsule-page {
                padding: 25px 15px 40px;
            }

            .capsule-header h1 {
                font-size: 32px;
            }

            .capsule-form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="capsule-page">

        <div class="capsule-container">

            <!-- HEADER -->
            <div class="capsule-header">
                <h1>💌 Future Capsule</h1>

                <p>
                    Write a message to your future self and unlock it on a special date.
                </p>
            </div>


            <!-- CREATE CAPSULE -->
            <div class="capsule-form-card">

                <h2>Create a Future Capsule</h2>

                <form id="capsuleForm">

                    <div class="form-group">

                        <label for="capsuleTitle">
                            Capsule Title
                        </label>

                        <input
                            type="text"
                            id="capsuleTitle"
                            placeholder="Example: My Future Success"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="capsuleMessage">
                            Message to Your Future Self
                        </label>

                        <textarea
                            id="capsuleMessage"
                            placeholder="Write something you want your future self to read..."
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="unlockDate">
                            Unlock Date
                        </label>

                        <input
                            type="date"
                            id="unlockDate"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="save-capsule-btn"
                        id="saveCapsuleBtn"
                    >
                        Save Future Capsule
                    </button>

                </form>

            </div>


            <!-- CAPSULES -->
            <div id="capsulesSection">

                <div class="loading-message">
                    Loading your Future Capsules...
                </div>

            </div>

        </div>

    </div>


    <script>

        /* =========================
           LOGIN CHECK
        ========================= */

        const loggedIn =
            localStorage.getItem("futureMeLoggedIn");

        if (loggedIn !== "true") {

            window.location.href = "login.html";

        }


        /* =========================
           GET CURRENT USER
        ========================= */

        let currentUser = null;

        try {

            currentUser = JSON.parse(
                localStorage.getItem("futureMeCurrentUser")
            );

        } catch (error) {

            currentUser = null;

        }


        if (!currentUser || !currentUser.id) {

            localStorage.removeItem("futureMeLoggedIn");
            localStorage.removeItem("futureMeCurrentUser");

            window.location.href = "login.html";

        }


        /* =========================
           ELEMENTS
        ========================= */

        const capsuleForm =
            document.getElementById("capsuleForm");

        const capsuleTitle =
            document.getElementById("capsuleTitle");

        const capsuleMessage =
            document.getElementById("capsuleMessage");

        const unlockDate =
            document.getElementById("unlockDate");

        const saveCapsuleBtn =
            document.getElementById("saveCapsuleBtn");

        const capsulesSection =
            document.getElementById("capsulesSection");


        /* =========================
           SET MINIMUM DATE
        ========================= */

        const today =
            new Date().toISOString().split("T")[0];

        unlockDate.min = today;


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHTML(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           FORMAT DATE
        ========================= */

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }

            const date =
                new Date(dateString + "T00:00:00");

            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                }
            );

        }


        /* =========================
           LOAD CAPSULES
        ========================= */

        async function loadCapsules() {

            capsulesSection.innerHTML = `
                <div class="loading-message">
                    Loading your Future Capsules...
                </div>
            `;

            try {

                const response =
                    await fetch(
                        `api/get_user_data.php?user_id=${encodeURIComponent(currentUser.id)}`
                    );

                const data =
                    await response.json();

                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Failed to load capsules."
                    );

                }


                const capsules =
                    Array.isArray(data.capsules)
                        ? data.capsules
                        : [];


                /* =========================
                   SAVE LATEST CAPSULE LOCALLY
                ========================= */

                if (capsules.length > 0) {

                    localStorage.setItem(
                        "futureMeCapsule",
                        JSON.stringify(capsules[0])
                    );

                } else {

                    localStorage.removeItem(
                        "futureMeCapsule"
                    );

                }


                renderCapsules(capsules);

            } catch (error) {

                console.error(error);

                capsulesSection.innerHTML = `
                    <div class="error-message">
                        Unable to load Future Capsules.
                        <br><br>
                        ${escapeHTML(error.message)}
                    </div>
                `;

            }

        }


        /* =========================
           RENDER CAPSULES
        ========================= */

        function renderCapsules(capsules) {

            if (capsules.length === 0) {

                capsulesSection.innerHTML = `
                    <div class="empty-capsules">
                        <h3>No Future Capsules Yet 💌</h3>

                        <p>
                            Create your first message to your future self.
                        </p>
                    </div>
                `;

                return;
            }


            const todayDate =
                new Date();

            todayDate.setHours(
                0,
                0,
                0,
                0
            );


            const cards =
                capsules.map(capsule => {

                    const unlock =
                        new Date(
                            capsule.unlock_date +
                            "T00:00:00"
                        );

                    unlock.setHours(
                        0,
                        0,
                        0,
                        0
                    );


                    const isUnlocked =
                        unlock <= todayDate;


                    const status =
                        isUnlocked
                            ? "🔓 Unlocked"
                            : "🔒 Locked";


                    return `
                        <div class="capsule-card ${
                            isUnlocked
                                ? "unlocked"
                                : "locked"
                        }">

                            <span class="capsule-status">
                                ${status}
                            </span>

                            <h3>
                                ${escapeHTML(capsule.title)}
                            </h3>

                            <div class="unlock-date">
                                📅 Unlock Date:
                                ${formatDate(capsule.unlock_date)}
                            </div>

                            ${
                                isUnlocked
                                    ? `
                                        <div class="capsule-message">
                                            ${escapeHTML(capsule.message)}
                                        </div>
                                    `
                                    : `
                                        <div class="locked-message">
                                            🔐 This message is locked
                                            until ${formatDate(capsule.unlock_date)}.
                                        </div>
                                    `
                            }

                            <button
                                type="button"
                                class="delete-capsule-btn"
                                data-id="${capsule.id}"
                            >
                                Delete
                            </button>

                        </div>
                    `;

                }).join("");


            capsulesSection.innerHTML = `
                <div class="capsule-list">
                    ${cards}
                </div>
            `;


            /* =========================
               DELETE BUTTONS
            ========================= */

            const deleteButtons =
                document.querySelectorAll(
                    ".delete-capsule-btn"
                );


            deleteButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        const capsuleId =
                            button.dataset.id;

                        deleteCapsule(
                            capsuleId
                        );

                    }
                );

            });

        }


        /* =========================
           SAVE CAPSULE
        ========================= */

        capsuleForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const title =
                    capsuleTitle.value.trim();

                const message =
                    capsuleMessage.value.trim();

                const date =
                    unlockDate.value;


                if (
                    title === "" ||
                    message === "" ||
                    date === ""
                ) {

                    alert(
                        "Please fill all Future Capsule fields."
                    );

                    return;

                }


                saveCapsuleBtn.disabled = true;

                saveCapsuleBtn.textContent =
                    "Saving...";


                try {

                    const formData =
                        new FormData();

                    formData.append(
                        "user_id",
                        currentUser.id
                    );

                    formData.append(
                        "title",
                        title
                    );

                    formData.append(
                        "message",
                        message
                    );

                    formData.append(
                        "unlock_date",
                        date
                    );


                    const response =
                        await fetch(
                            "api/save_capsule.php",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    if (!data.success) {

                        throw new Error(
                            data.message ||
                            "Failed to save capsule."
                        );

                    }


                    /* =========================
                       LOCAL STORAGE COMPATIBILITY
                    ========================= */

                    localStorage.setItem(
                        "futureMeCapsule",
                        JSON.stringify({
                            id: data.capsule_id,
                            title: title,
                            message: message,
                            unlock_date: date
                        })
                    );


                    alert(
                        "Future Capsule saved successfully! 💌"
                    );


                    capsuleForm.reset();

                    unlockDate.min = today;


                    await loadCapsules();

                } catch (error) {

                    console.error(error);

                    alert(
                        error.message ||
                        "Something went wrong while saving the capsule."
                    );

                } finally {

                    saveCapsuleBtn.disabled = false;

                    saveCapsuleBtn.textContent =
                        "Save Future Capsule";

                }

            }
        );


        /* =========================
           DELETE CAPSULE
        ========================= */

        async function deleteCapsule(capsuleId) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this Future Capsule?"
                );


            if (!confirmDelete) {
                return;
            }


            try {

                const formData =
                    new FormData();

                formData.append(
                    "user_id",
                    currentUser.id
                );

                formData.append(
                    "capsule_id",
                    capsuleId
                );


                const response =
                    await fetch(
                        "api/delete_capsule.php",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!data.success) {

                    throw new Error(
                        data.message ||
                        "Failed to delete capsule."
                    );

                }


                /* =========================
                   REMOVE LOCAL COPY
                ========================= */

                const savedCapsule =
                    JSON.parse(
                        localStorage.getItem(
                            "futureMeCapsule"
                        ) || "null"
                    );


                if (
                    savedCapsule &&
                    String(savedCapsule.id) ===
                    String(capsuleId)
                ) {

                    localStorage.removeItem(
                        "futureMeCapsule"
                    );

                }


                alert(
                    "Future Capsule deleted successfully."
                );


                await loadCapsules();

            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Something went wrong while deleting the capsule."
                );

            }

        }


        /* =========================
           INITIAL LOAD
        ========================= */

        loadCapsules();

    </script>

</body>
</html>
